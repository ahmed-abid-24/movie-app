<div class="detail" *ngIf="movie$ | async as m; else loading">
  <div class="poster">
    <img
      [src]="m.poster_path ? imgUrl + m.poster_path : 'https://placehold.co/300x450?text=No+poster'"
      [alt]="m.title">
    <fa-icon class="heart" [class.active]="wishlist.has(m.id)" [icon]="faHeart" (click)="toggle(m)"></fa-icon>
  </div>
  <div class="info">
    <h2>{{ m.title }}</h2>
    <p><b>Original title</b> {{ m.original_title }}</p>
    <p><b>Original language</b> {{ m.original_language }}</p>
    <p><b>Release date</b> {{ m.release_date | date:'MMM d, y' }}</p>
    <p><b>Popularity</b> {{ m.popularity }}</p>
    <p><b>Vote average</b> {{ m.vote_average }}</p>
    <p><b>Vote count</b> {{ m.vote_count }}</p>
    <p><b>Overview</b></p>
    <p>{{ m.overview }}</p>
  </div>
</div>

<ng-template #loading>
  <p style="padding:20px">Chargement...</p>
</ng-template>
